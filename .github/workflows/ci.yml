name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --dev --locked
      - run: uv run pytest
      - run: uv run ruff check --config pyproject.toml src tests
      - run: uv run ruff format --config pyproject.toml --check src tests
      - run: uv build
